name: Conferência com a Receita

# Robô de conferência das skills que espelham a calculadora da Receita Federal (veja o AGENTS.md).
# Todo dia olha a Receita, monta a base, compila a calculadora oficial, roda a bateria inteira e decide:
# publica sozinho (só tabelas ou release sem código, com 100%), abre PR de regra, abre issue ou não faz nada.
#
# Três cuidados:
# - o código da Receita (Maven, Flyway, o JAR) roda só no job `conferir`, que só lê o repositório e não
#   guarda credencial no checkout. Quem escreve (commit, PR, issue) é o job `agir`, que não roda código da Receita;
# - commit feito com o GITHUB_TOKEN não dispara outros workflows: o `agir` roda o --check e os testes antes
#   do commit e dispara a release ele mesmo;
# - o GitHub desliga workflow agendado depois de 60 dias sem atividade no repositório: o job `manter`
#   reativa este workflow ao fim de toda execução.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conferencia-receita
  cancel-in-progress: false

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.listar.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: listar
        name: Uma entrada da matriz por pasta de conferencia/
        run: |
          set -euo pipefail
          skills=$(python3 -c 'import json,pathlib; print(json.dumps(sorted(p.parent.name for p in pathlib.Path("conferencia").glob("*/config.json"))))')
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Skills: $skills"

  conferir:
    needs: listar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.listar.outputs.skills) }}
    env:
      SKILL: ${{ matrix.skill }}
      SAIDA: ${{ runner.temp }}/saida
      ETAPA: ${{ runner.temp }}/saida/etapa.txt
      RECEITA: ${{ runner.temp }}/receita
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Olhar a Receita
        id: detectar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SAIDA" "$RECEITA"
          echo "Olhar a Receita" > "$ETAPA"
          CFG="conferencia/$SKILL/config.json"
          META="conferencia/$SKILL/meta.json"
          CALC_REPO=$(jq -er .calculadora.repo "$CFG")
          CALC_CODIGO=$(jq -er .calculadora.caminho_codigo "$CFG")
          MIGR_REPO=$(jq -er .migracoes.repo "$CFG")
          MIGR_CAMINHO=$(jq -er .migracoes.caminho "$CFG")
          CALC_ANTES=$(jq -er .calculadora.commit "$META")
          MIGR_ANTES=$(jq -er .migracoes.commit "$META")
          # A última release (o GitHub já deixa de fora rascunho e pré-release).
          TAG=$(gh api "repos/$CALC_REPO/releases/latest" --jq .tag_name)
          case "$TAG" in *[!A-Za-z0-9._-]*|"") echo "tag inesperada: $TAG"; exit 1;; esac
          VERSAO="${TAG#v}"
          # Clone sem blobs: o histórico basta para o diff de nomes; o checkout baixa o resto.
          git clone --quiet --filter=blob:none "https://github.com/$CALC_REPO.git" "$RECEITA/sn"
          git -C "$RECEITA/sn" -c advice.detachedHead=false checkout --quiet "refs/tags/$TAG"
          CALC_DEPOIS=$(git -C "$RECEITA/sn" rev-parse HEAD)
          git clone --quiet --filter=blob:none "https://github.com/$MIGR_REPO.git" "$RECEITA/rr"
          MIGR_DEPOIS=$(git -C "$RECEITA/rr" rev-parse HEAD)
          # Caminhos mudados: tudo o que mudou na calculadora e, das migrações, só o que está no caminho delas.
          # Commit espelhado que sumiu do histórico faz o git falhar aqui: vira issue de falha.
          : > "$SAIDA/caminhos.txt"
          if [ "$CALC_ANTES" != "$CALC_DEPOIS" ]; then
            git -C "$RECEITA/sn" diff --no-renames --name-only "$CALC_ANTES" "$CALC_DEPOIS" >> "$SAIDA/caminhos.txt"
            git -C "$RECEITA/sn" diff --no-renames "$CALC_ANTES" "$CALC_DEPOIS" -- "$CALC_CODIGO" > "$SAIDA/diff-java.txt"
          fi
          if [ "$MIGR_ANTES" != "$MIGR_DEPOIS" ]; then
            git -C "$RECEITA/rr" diff --no-renames --name-only "$MIGR_ANTES" "$MIGR_DEPOIS" -- "$MIGR_CAMINHO" >> "$SAIDA/caminhos.txt"
          fi
          jq -n --arg v "$VERSAO" --arg c "$CALC_DEPOIS" --arg m "$MIGR_DEPOIS" \
            '{calculadora: {versao: $v, commit: $c}, migracoes: {commit: $m}}' > "$SAIDA/upstream.json"
          cat "$SAIDA/upstream.json"
          python3 scripts/receita_robo.py detectar --skill "$SKILL" --upstream "$SAIDA/upstream.json" \
            --caminhos "$SAIDA/caminhos.txt" --saida "$SAIDA/estado.json"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.detectar.outputs.classe != 'nada'
        with:
          distribution: temurin
          java-version: "25"

      - name: Montar a base pelo Flyway oficial e pelo receita_base.py
        if: steps.detectar.outputs.classe != 'nada'
        run: |
          set -euo pipefail
          echo "Montar a base pelo Flyway oficial e pelo receita_base.py" > "$ETAPA"
          (cd "$RECEITA/rr" && mkdir -p calculadora/db && mvn -B -q flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf)
          python3 scripts/receita_base.py --skill "$SKILL" --repo "$RECEITA/rr" --completa "$SAIDA/base-completa.db"
          echo "Comparar as duas bases" > "$ETAPA"
          python3 scripts/receita_robo.py comparar-bases --skill "$SKILL" \
            --flyway "$RECEITA/rr/calculadora/db/calculadora-pro.db" --montada "$SAIDA/base-completa.db"

      - name: Compilar e subir a calculadora oficial
        if: steps.detectar.outputs.classe != 'nada'
        run: |
          set -euo pipefail
          echo "Compilar a calculadora oficial" > "$ETAPA"
          mkdir -p "$RECEITA/sn/calculadora/db"
          cp "$RECEITA/rr/calculadora/db/calculadora-pro.db" "$RECEITA/sn/calculadora/db/"
          (cd "$RECEITA/sn" && mvn -B -q clean package -DskipTests)
          echo "Subir a calculadora oficial" > "$ETAPA"
          (cd "$RECEITA/sn" && nohup java -Dspring.profiles.active=offline -jar target/api-simples-nacional.jar > "$SAIDA/oficial.log" 2>&1 &)
          BASE=$(jq -er .base.versao "conferencia/$SKILL/meta.json")
          python3 scripts/receita_robo.py esperar-oficial --url http://127.0.0.1:8082/api \
            --versao "${{ steps.detectar.outputs.versao }}" --base "$BASE" --prazo 600

      - name: Conferência completa
        id: paridade
        if: steps.detectar.outputs.classe != 'nada'
        run: |
          set -uo pipefail
          echo "Conferência completa" > "$ETAPA"
          python3 scripts/receita_paridade.py --skill "$SKILL" --oficial http://127.0.0.1:8082/api \
            --completa --base-completa "$SAIDA/base-completa.db" > "$SAIDA/paridade.txt" 2>&1
          codigo=$?
          echo "$codigo" > "$SAIDA/paridade-codigo.txt"
          head -n 200 "$SAIDA/paridade.txt"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - name: Gravar as esperadas
        if: steps.paridade.outputs.codigo == '0'
        run: |
          set -euo pipefail
          echo "Gravar as esperadas" > "$ETAPA"
          python3 scripts/receita_paridade.py --skill "$SKILL" --oficial http://127.0.0.1:8082/api --gravar-esperadas --amostra 400

      - name: Guardar o que o job agir precisa
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$SAIDA"
          base=$(jq -er .base_destino "conferencia/$SKILL/config.json")
          [ -f "$base" ] && cp "$base" "$SAIDA/base-receita.db"
          cp "conferencia/$SKILL/meta.json" "$SAIDA/meta.json"
          cp "conferencia/$SKILL/esperadas.json" "$SAIDA/esperadas.json"
          echo "${{ job.status }}" > "$SAIDA/resultado.txt"
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conferencia-${{ matrix.skill }}
          path: ${{ runner.temp }}/saida
          retention-days: 14

  agir:
    needs: [listar, conferir]
    if: always() && needs.listar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        skill: ${{ fromJSON(needs.listar.outputs.skills) }}
    env:
      SKILL: ${{ matrix.skill }}
      ART: ${{ runner.temp }}/art
      ETAPA: ${{ runner.temp }}/etapa.txt
      GH_TOKEN: ${{ github.token }}
      EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A ponta do ramo agora, não a do começo da execução: o decidir confere que o meta.json não mudou.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: conferencia-${{ matrix.skill }}
          path: ${{ runner.temp }}/art

      - name: Decidir
        id: decidir
        run: |
          set -euo pipefail
          echo "Decidir" > "$ETAPA"
          titulo=$(python3 scripts/receita_robo.py texto --tipo titulo --de pr-regra --skill "$SKILL")
          pr=$(gh pr list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          resultado=$(cat "$ART/resultado.txt" 2>/dev/null || echo "sem artefato")
          codigo=$(cat "$ART/paridade-codigo.txt" 2>/dev/null || echo "")
          python3 scripts/receita_robo.py decidir --estado "$ART/estado.json" \
            --paridade "$ART/paridade.txt" --codigo "$codigo" \
            --pr-aberto "$([ -n "$pr" ] && echo true || echo false)" \
            --resultado-conferencia "$resultado" --etapa "$ART/etapa.txt" --ramo "$GITHUB_REF"

      - name: Parar com falha
        if: steps.decidir.outputs.acao == 'issue-falha'
        env:
          MOTIVO: ${{ steps.decidir.outputs.motivo }}
        run: |
          printf '%s\n' "$MOTIVO" > "$ETAPA"
          echo "O robô não decidiu: $MOTIVO"
          exit 1

      - name: Publicar
        if: steps.decidir.outputs.acao == 'publicar'
        id: publicar
        run: |
          set -euo pipefail
          echo "Publicar: aplicar a base e a meta novas" > "$ETAPA"
          base=$(jq -er .base_destino "conferencia/$SKILL/config.json")
          cp "$ART/base-receita.db" "$base"
          cp "$ART/meta.json" "$ART/esperadas.json" "conferencia/$SKILL/"
          python3 scripts/receita_robo.py publicar --estado "$ART/estado.json" \
            --paridade "$ART/paridade.txt" --codigo "$(cat "$ART/paridade-codigo.txt")"
          echo "Publicar: sync_plugins.py" > "$ETAPA"
          python3 scripts/sync_plugins.py
          echo "Publicar: sync_plugins.py --check" > "$ETAPA"
          python3 scripts/sync_plugins.py --check
          echo "Publicar: testes" > "$ETAPA"
          CD2_BASE_COMPLETA="$ART/base-completa.db" python3 -m unittest discover -s tests
          echo "Publicar: commit e push na main" > "$ETAPA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- core conferencia plugins gpts CHANGELOG.md README.md docs
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            echo "Sobrou arquivo fora do que o robô publica."
            exit 1
          fi
          versao=$(jq -er .version core/cd2-super/plugin.core.json)
          basev=$(jq -er .base.versao "conferencia/$SKILL/meta.json")
          git commit -q -m "chore($SKILL): conferência com a Receita, base $basev (versão $versao)" \
            -m "Publicado pelo robô de conferência: $EXECUCAO"
          git push origin HEAD:main
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "Publicar: disparar a release" > "$ETAPA"
          gh workflow run release.yml --ref main

      - name: Abrir ou atualizar a issue do GPT
        if: steps.decidir.outputs.acao == 'publicar'
        run: |
          set -euo pipefail
          echo "Abrir ou atualizar a issue do GPT" > "$ETAPA"
          titulo=$(python3 scripts/receita_robo.py texto --tipo titulo --de issue-gpt --skill "$SKILL")
          anterior=$(git show HEAD~1:core/cd2-super/plugin.core.json | jq -er .version)
          numero=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
          if [ -n "$numero" ]; then gh issue view "$numero" --json body --jq .body > "$RUNNER_TEMP/corpo-atual.md"; fi
          python3 scripts/receita_robo.py texto --tipo issue-gpt --skill "$SKILL" \
            --versao-nova "${{ steps.publicar.outputs.versao }}" --versao-anterior "$anterior" \
            --corpo-atual "$RUNNER_TEMP/corpo-atual.md" --saida "$RUNNER_TEMP/corpo.md"
          if [ -n "$numero" ]; then
            gh issue edit "$numero" --body-file "$RUNNER_TEMP/corpo.md"
          else
            gh issue create --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
          fi

      - name: Abrir ou atualizar o PR de regra
        if: steps.decidir.outputs.acao == 'pr-regra'
        run: |
          set -euo pipefail
          echo "Abrir ou atualizar o PR de regra" > "$ETAPA"
          titulo=$(python3 scripts/receita_robo.py texto --tipo titulo --de pr-regra --skill "$SKILL")
          python3 scripts/receita_robo.py texto --tipo pr-regra --estado "$ART/estado.json" --base-nova "$ART/meta.json" \
            --paridade "$ART/paridade.txt" --codigo "$(cat "$ART/paridade-codigo.txt")" \
            --diff "$ART/diff-java.txt" --saida "$RUNNER_TEMP/corpo.md"
          pr="${{ steps.decidir.outputs.pr }}"
          if [ -n "$pr" ]; then
            # O ramo do PR é de quem porta: o robô só atualiza o corpo e comenta o que mais mudou.
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/corpo.md"
            gh pr view "$pr" --json comments --jq '[.comments[].body]' > "$RUNNER_TEMP/comentarios.json"
            python3 scripts/receita_robo.py texto --tipo regra-atualizada --estado "$ART/estado.json" --base-nova "$ART/meta.json" \
              --paridade "$ART/paridade.txt" --codigo "$(cat "$ART/paridade-codigo.txt")" \
              --comentarios "$RUNNER_TEMP/comentarios.json" --saida "$RUNNER_TEMP/comentario.md"
            if [ -s "$RUNNER_TEMP/comentario.md" ]; then gh pr comment "$pr" --body-file "$RUNNER_TEMP/comentario.md"; fi
            exit 0
          fi
          versao=$(jq -er .upstream.calculadora.versao "$ART/estado.json")
          ramo="receita/$SKILL-$versao"
          if git ls-remote --exit-code --heads origin "$ramo" > /dev/null; then
            echo "O ramo $ramo já existe sem PR aberto. Feche ou apague o ramo, ou abra o PR à mão."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ramo"
          base=$(jq -er .base_destino "conferencia/$SKILL/config.json")
          cp "$ART/base-receita.db" "$base"
          cp "$ART/meta.json" "conferencia/$SKILL/meta.json"
          python3 scripts/receita_robo.py meta --skill "$SKILL"
          python3 scripts/sync_plugins.py
          git add -A -- core conferencia plugins gpts README.md docs
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            echo "Sobrou arquivo fora do que o robô publica."
            exit 1
          fi
          git commit -q -m "chore($SKILL): base nova da Receita para portar a $versao" -m "Aberto pelo robô de conferência: $EXECUCAO"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"

      - name: Comentar no PR de regra que as tabelas estão paradas
        if: steps.decidir.outputs.acao == 'congelado'
        run: |
          set -euo pipefail
          echo "Comentar no PR de regra" > "$ETAPA"
          pr="${{ steps.decidir.outputs.pr }}"
          gh pr view "$pr" --json comments --jq '[.comments[].body]' > "$RUNNER_TEMP/comentarios.json"
          python3 scripts/receita_robo.py texto --tipo congelado --estado "$ART/estado.json" --base-nova "$ART/meta.json" \
            --paridade "$ART/paridade.txt" --codigo "$(cat "$ART/paridade-codigo.txt" 2>/dev/null || true)" \
            --comentarios "$RUNNER_TEMP/comentarios.json" --saida "$RUNNER_TEMP/comentario.md"
          if [ -s "$RUNNER_TEMP/comentario.md" ]; then gh pr comment "$pr" --body-file "$RUNNER_TEMP/comentario.md"; fi

      - name: Abrir ou atualizar a issue de divergência
        if: steps.decidir.outputs.acao == 'issue-divergencia'
        run: |
          set -euo pipefail
          echo "Abrir ou atualizar a issue de divergência" > "$ETAPA"
          titulo=$(python3 scripts/receita_robo.py texto --tipo titulo --de issue-divergencia --skill "$SKILL")
          args=(--estado "$ART/estado.json" --base-nova "$ART/meta.json" --paridade "$ART/paridade.txt"
                --codigo "$(cat "$ART/paridade-codigo.txt")" --execucao "$EXECUCAO")
          python3 scripts/receita_robo.py texto --tipo issue-divergencia "${args[@]}" --saida "$RUNNER_TEMP/corpo.md"
          numero=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
          if [ -z "$numero" ]; then
            gh issue create --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
            exit 0
          fi
          gh issue view "$numero" --json comments --jq '[.comments[].body]' > "$RUNNER_TEMP/comentarios.json"
          python3 scripts/receita_robo.py texto --tipo issue-divergencia "${args[@]}" \
            --comentarios "$RUNNER_TEMP/comentarios.json" --saida "$RUNNER_TEMP/comentario.md"
          if [ -s "$RUNNER_TEMP/comentario.md" ]; then gh issue comment "$numero" --body-file "$RUNNER_TEMP/comentario.md"; fi

      - name: Abrir ou atualizar a issue de falha
        if: failure()
        run: |
          set -uo pipefail
          titulo=$(python3 scripts/receita_robo.py texto --tipo titulo --de issue-falha --skill "$SKILL")
          motivo=$(cat "$ETAPA" 2>/dev/null || echo "não informada")
          args=(--skill "$SKILL" --estado "$ART/estado.json" --motivo "$motivo" --execucao "$EXECUCAO")
          python3 scripts/receita_robo.py texto --tipo issue-falha "${args[@]}" --saida "$RUNNER_TEMP/corpo.md"
          numero=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
          if [ -z "$numero" ]; then
            gh issue create --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
            exit 0
          fi
          gh issue view "$numero" --json comments --jq '[.comments[].body]' > "$RUNNER_TEMP/comentarios.json"
          python3 scripts/receita_robo.py texto --tipo issue-falha "${args[@]}" \
            --comentarios "$RUNNER_TEMP/comentarios.json" --saida "$RUNNER_TEMP/comentario.md"
          if [ -s "$RUNNER_TEMP/comentario.md" ]; then gh issue comment "$numero" --body-file "$RUNNER_TEMP/comentario.md"; fi

  manter:
    needs: [listar, conferir, agir]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Manter o agendamento ligado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Workflow já ativo faz o gh recusar o enable; a chamada da API vale nos dois casos.
          gh workflow enable conferencia-receita.yml --repo "$GITHUB_REPOSITORY" \
            || gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/conferencia-receita.yml/enable"
